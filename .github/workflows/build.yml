name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore release keystore (if secrets are set)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: bash build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: HomeGSearch
          path: build/HomeGSearch.apk

      - name: Attach APK to release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "${KEYSTORE_FILE:-}" ]; then
            echo "Refusing to publish an APK signed with a throwaway key. Set the KEYSTORE_* secrets." >&2
            exit 1
          fi
          TAG="${{ github.event.release.tag_name || github.ref_name }}"
          SHA=$(sha256sum build/HomeGSearch.apk | cut -d' ' -f1)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" build/HomeGSearch.apk --clobber
            BODY=$(gh release view "$TAG" --json body -q .body)
            printf '%s\n\nSHA-256 (HomeGSearch.apk): `%s`\n' "$BODY" "$SHA" > notes.md
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" build/HomeGSearch.apk --title "$TAG" \
              --notes "SHA-256 (HomeGSearch.apk): \`$SHA\`"
          fi
